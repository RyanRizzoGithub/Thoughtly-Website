      transform: translateY(20px);

      transform: translateY(0);
    }

      align-items: center;
      justify-content: space-between;

      padding: 26px 28px;

      border: none;
      cursor: pointer;
      text-align: left;
      font-family: inherit;
    }

    #tly-video-page .tly-va-trigger-text .tly-va-num {
      display: inline-block;
      font-family: Georgia, serif;
      font-size: 13px;
      letter-spacing: 0.1em;
      color: #7485A4;
      margin-bottom: 6px;
    }

    #tly-video-page .tly-va-trigger-text h3 {
      font-family: Georgia, serif;
      font-size: 22px;
      line-height: 1.3;
      margin: 0 0 6px;
      color: #3D403C;
    }

    #tly-video-page .tly-va-trigger-text p {
      font-size: 15px;
      line-height: 1.55;
      margin: 0;
      color: #3D403C;
      opacity: 0.75;
      max-width: 520px;
      /* Truncate to 2 lines with "..." while collapsed */
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Show the full description once the item is open */
    #tly-video-page .tly-va-item.tly-open .tly-va-trigger-text p {
      -webkit-line-clamp: unset;
      overflow: visible;
    }

    #tly-video-page .tly-va-icon {
      flex-shrink: 0;
      width: 34px;
      height: 34px;
      border-radius: 5px;
      background: #3D403C;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.35s ease, background 0.3s ease;
    }

    #tly-video-page .tly-va-item.tly-open .tly-va-icon {
      background: #7485A4;
      transform: rotate(45deg);
    }

    #tly-video-page .tly-va-icon svg { width: 14px; height: 14px; }

    #tly-video-page .tly-va-panel {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.5s ease;
    }

    #tly-video-page .tly-va-panel-inner {

    }

    #tly-video-page .tly-va-embed {

      width: 100%;
      padding-top: 56.25%;
      background: #3D403C;
      border-radius: 5px;
      overflow: hidden;
      margin-bottom: 18px;
    }

    #tly-video-page .tly-va-embed iframe,
    #tly-video-page .tly-va-embed .wistia_embed {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
    }

      #tly-video-page .tly-va-trigger { padding: 20px 18px; }
      #tly-video-page .tly-va-panel-inner { padding: 0 18px 26px; }

<script>
(function () {
  var root = document.getElementById('tly-video-page');
  if (!root) return;

  // Accordion behavior — click a trigger to expand/collapse its panel.
  var items = root.querySelectorAll('[data-tly-item]');
  items.forEach(function (item) {
    var trigger = item.querySelector('[data-tly-trigger]');
    var panel = item.querySelector('[data-tly-panel]');

    trigger.addEventListener('click', function () {
      var isOpen = item.classList.contains('tly-open');

      // Lazy-load: on first open, load the video by moving data-src -> src.
      var iframe = panel.querySelector('iframe[data-src]');
      if (iframe && !isOpen) {
        iframe.src = iframe.getAttribute('data-src');
        iframe.removeAttribute('data-src');
      }

      // close any other open item (comment this loop out to allow multiple open at once)
      items.forEach(function (other) {
        if (other !== item) {
          other.classList.remove('tly-open');
          other.querySelector('[data-tly-panel]').style.maxHeight = null;
          other.querySelector('[data-tly-trigger]').setAttribute('aria-expanded', 'false');
        }
      });

      if (isOpen) {
        item.classList.remove('tly-open');
        panel.style.maxHeight = null;
        trigger.setAttribute('aria-expanded', 'false');
      } else {
        item.classList.add('tly-open');
        panel.style.maxHeight = panel.scrollHeight + 'px';
        trigger.setAttribute('aria-expanded', 'true');
      }
    });
  });

  // Fade-in on scroll
  var fadeEls = root.querySelectorAll('.tly-va-eyebrow, .tly-va-heading, .tly-va-sub, .tly-va-item');
  var observer = new IntersectionObserver(function (entries) {
    entries.forEach(function (entry) {
      if (entry.isIntersecting) {
        entry.target.classList.add('tly-in');
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.15 });
  fadeEls.forEach(function (el) { observer.observe(el); });
})();
</script>
